name: 🚀 Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment name that holds the signing secrets
        required: false
        default: release
  push:
    tags:
      - 'v*'   # ONLY triggers on version tags like v1.3.0, v2.0.0-beta

jobs:
  release:
    name: Build and Release Signed APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.release_environment || 'release' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # default is 1; a shallow clone can't see previous tags

      - name: Fail if baseVersionCode did not increase
        run: |
          read_code() { grep -oP 'val baseVersionCode\s*=\s*\K\d+' "$1" || echo 0; }
          curr=$(read_code app/build.gradle.kts)
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          [ -z "$prev_tag" ] && exit 0
          git show "$prev_tag:app/build.gradle.kts" > /tmp/prev.kts
          prev=$(read_code /tmp/prev.kts)
          echo "$prev_tag = $prev  ->  ${{ github.ref_name }} = $curr"
          [ "$curr" -gt "$prev" ] || { echo "::error::versionCode regression: $curr <= $prev"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-new.keystore
          echo "✅ Keystore decoded"

      - name: Compile check before release
        run: ./gradlew compileUniversalReleaseKotlin compileArmReleaseKotlin compileAarch64ReleaseKotlin --no-daemon --stacktrace

      - name: Build & Sign Release APK
        run: |
          ./gradlew assembleArmRelease assembleAarch64Release assembleUniversalRelease --no-daemon --stacktrace --info
          if [ -z "$(find app/build/outputs/apk/ -name "*.apk")" ]; then
            echo "❌ APK build failed - no APK generated"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}



      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build output"
            exit 1
          fi
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "✅ APK signature verified" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Rename APKs
        run: |
          export VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then export VERSION="v1.3.6.1"; fi
          find app/build/outputs/apk/ -name "*.apk" -exec bash -c '
            file="$1"
            filename=$(basename "$file")
            if [[ "$filename" == app-arm-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-arm.apk"
            elif [[ "$filename" == app-aarch64-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-aarch64.apk"
            elif [[ "$filename" == app-universal-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-universal.apk"
            fi
          ' bash {} \;
          echo "✅ APKs renamed:"
          ls -lh app/build/outputs/apk/

      - name: Wipe keystore from runner (security cleanup)
        if: always()
        run: |
          rm -f release-new.keystore
          echo "🔒 Keystore wiped from runner"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omni Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          make_latest: ${{ (contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) && 'false' || 'true' }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/omni-browser-*.apk
          body: |
            ## Omni Browser ${{ github.ref_name }}

            > 🚀 **Highlights in this release**
            > - **UI & Buttons Layout Customization**: Separated appearance settings and introduced a dedicated Buttons Layout customization screen for tailoring toolbar actions.
            > - **Enhanced Privacy & Deep Burn**: Fire button & "Burn all data" now atomic and thorough—wiping site permissions, all Gecko profile disk caches, shader/thumbnail caches, and background session states (#140).
            > - **Calendar (.ics) & Webcal Downloads**: Native handling and download support for `.ics`, `.ical`, `.ifb` calendar files and `webcal://` links without blanket spam blocks (#141).
            > - **Text Scaling & Accessibility Fixes**: Improved layout robustness and text scaling across preferences and bottom menu sheets.

            ---

            ## 🛠️ What's New in ${{ github.ref_name }} (since v1.3.5.1)

            ### 🎨 UI & Customization
            - **Dedicated Buttons Layout Screen**: Configurable toolbar action placements and cleaner separation between theme appearance and toolbar buttons.
            - **Menu Sheet Polish**: Cleaned up bottom menu sheet layout for faster navigation and smoother interaction.
            - **Accessibility & Font Scaling**: Fixed text scaling issues across settings, appearance, and dialog sheets.

            ### 🔒 Privacy & Data Clearing (#140)
            - **Atomic Burn All Data**: Immediately terminates active Gecko sessions prior to wiping to prevent background tabs from rewriting cache.
            - **Comprehensive Cache Purge**: Clears Gecko profile disk caches (`cache2`, `startupCache`, `jumpListCache`, `shader-cache`, `thumbnails`), `codeCacheDir`, and external cache directories.
            - **Site Permissions Reset**: Guarantees `browser_site_permissions.json` and in-memory permissions state are fully erased upon burning data.

            ### 📅 Calendar & Download Engine (#141)
            - **iCalendar (.ics / .ical / .ifb) Support**: Legitimate calendar files and `webcal://` subscriptions download seamlessly via browser download manager.
            - **Smart Spam Filtering**: Eliminated blanket calendar blocking while retaining strict safety checks.
            - **Calendar Download Dialog**: Visual DateRange icon and dedicated MIME type recognition in `StreamDownloadEngine` and `DownloadManagerScreen`.

            ---

            ### 📦 Installation Requirements
            - Android 8.0+ (API 26) is required.
            - If you are not sure which build to choose, download the **universal** APK (`omni-browser-${{ github.ref_name }}-universal.apk`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
