name: 🚀 Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment name that holds the signing secrets
        required: false
        default: release
  push:
    tags:
      - 'v*'   # ONLY triggers on version tags like v1.3.0, v2.0.0-beta

jobs:
  release:
    name: Build and Release Signed APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.release_environment || 'release' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # default is 1; a shallow clone can't see previous tags

      - name: Fail if baseVersionCode did not increase
        run: |
          read_code() { grep -oP 'val baseVersionCode\s*=\s*\K\d+' "$1" || echo 0; }
          curr=$(read_code app/build.gradle.kts)
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          [ -z "$prev_tag" ] && exit 0
          git show "$prev_tag:app/build.gradle.kts" > /tmp/prev.kts
          prev=$(read_code /tmp/prev.kts)
          echo "$prev_tag = $prev  ->  ${{ github.ref_name }} = $curr"
          [ "$curr" -gt "$prev" ] || { echo "::error::versionCode regression: $curr <= $prev"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-new.keystore
          echo "✅ Keystore decoded"

      - name: Compile check before release
        run: ./gradlew compileUniversalReleaseKotlin compileArmReleaseKotlin compileAarch64ReleaseKotlin --no-daemon --stacktrace

      - name: Build & Sign Release APK
        run: |
          ./gradlew assembleArmRelease assembleAarch64Release assembleUniversalRelease --no-daemon --stacktrace --info
          if [ -z "$(find app/build/outputs/apk/ -name "*.apk")" ]; then
            echo "❌ APK build failed - no APK generated"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}



      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build output"
            exit 1
          fi
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "✅ APK signature verified" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Rename APKs
        run: |
          export VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then export VERSION="v1.2.6.3"; fi
          find app/build/outputs/apk/ -name "*.apk" -exec bash -c '
            file="$1"
            filename=$(basename "$file")
            if [[ "$filename" == app-arm-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-arm.apk"
            elif [[ "$filename" == app-aarch64-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-aarch64.apk"
            elif [[ "$filename" == app-universal-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-universal.apk"
            fi
          ' bash {} \;
          echo "✅ APKs renamed:"
          ls -lh app/build/outputs/apk/

      - name: Wipe keystore from runner (security cleanup)
        if: always()
        run: |
          rm -f release-new.keystore
          echo "🔒 Keystore wiped from runner"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omni Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          make_latest: "true"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/omni-browser-*.apk
          body: |
            ## Omni Browser ${{ github.ref_name }}

            ⚡ **Optimized R8 Minification Version with Highly Compressed Libraries**
            This build is optimized utilizing aggressive R8 compiler shrinking, optimization, and resource minification alongside highly compressed runtime libraries, delivering maximum performance, enhanced security, and the smallest possible installation footprint.

            ---

            ## 🚀 What's New in ${{ github.ref_name }}

            ### 🛠️ Critical Bug Fixes
            - **OAuth Popup & New Window Navigation**: Fixed a bug where sites like Deezer trying to open third-party logins (Facebook, Google, Spotify, etc.) were blocked. Expanded the authentication host bypass to handle all major OAuth, SSO, and OIDC endpoints.
            - **Keyboard Layout & Resize Stability**: Added `adjustResize` support and fixed dynamic bar-hiding to prevent soft keyboard interactions from breaking fixed/sticky web page elements, overlapping layouts, or forms.
            - **Google Sign-In Black Screen Fix**: Resolved an issue where closing a Google OAuth popup tab left the parent browser session in a blank/black screen state by implementing a secure GeckoView session-rebind counter.
            - **Firefox Account OAuth Flow**: Fully repaired the Firefox Sync OAuth login loop ("Something went wrong. Please close this tab and try again") by enabling third-party cookies, correcting authorization scopes, and bypassing bot protection using a dedicated Firefox Mobile User-Agent.
            - **WebExtension Click Crash**: Fixed a native browser crash/restart that triggered when clicking on certain extension actions.
            - **Responsive 3-Dot Menu**: Improved UI responsiveness by dynamically adapting the three-dot dropdown width on smaller screen form factors.

            ---

            ## 🔑 Password Managers & WebExtensions (v1.2.9.4)
            - **Bitwarden & Password Manager WebExtension Support**: Updated GeckoView prompt delegates (`onOptionalPrompt` and `onUpdatePrompt`) to allow dynamic host and clipboard permissions (`browser.permissions.request()`). Bitwarden, Proton Pass, 1Password, and KeePassXC can now dynamically inspect web forms, search vaults, and autofill credentials across all websites.
            - **Curated Extensions Store Expansion**: Added official entries for Bitwarden, Proton Pass, and KeePassXC-Browser to the built-in curated extension repository for 1-tap installation. Enhanced options page navigation with private browsing support.
            - **Omni Password Manager Master Toggle**: Added a master toggle switch in the Password Manager vault screen and Settings. When turned OFF, it completely silences login save prompts and autocomplete sheets.

            ## 📥 Download Notifications & Deep-Link Navigation (v1.2.9.4)
            - **In-Progress Download Tap**: Tapping the system notification of an ongoing download brings Omni Browser to the foreground and opens the Downloads section directly.
            - **Completed Download Tap & Direct File Opening**: Tapping a completed download notification opens the file directly with the default viewer via FileProvider. Added dual action buttons on the notification: "Open" and "Downloads".
            - **Deep Link Handlers**: Integrated robust event handlers in MainActivity to handle both cold starts and background resumes.

            ## 🔔 In-App OTA Update Notification System (v1.2.9.4)
            - **Automated GitHub Update Notifications**: Added a background check on app startup (throttled to at most once per 12 hours) to check the GitHub Releases API. Issues a high-priority system status bar notification when a new version is available.

            ## 🔄 Omni Sync & Firefox Account Cloud Integration (v1.2.9.4)
            - **Firefox Account Cloud Sync**: End-to-end encrypted cloud sync for bookmarks, history, tabs, and settings via Firefox Account infrastructure.
            - **P2P / Local Mesh Device Pairing**: Secure QR-code pairing and LAN transport sync across devices without third-party servers.
            - **Localization**: Translated and synchronized all sync UI strings across 11 supported languages (English, Hindi, Spanish, French, German, Portuguese, Polish, Russian, Japanese, Chinese, Arabic).

            ## 🎨 UI, Engine & Performance Stability (v1.2.9.4)
            - **Blank Screen on Startup Resolved**: Fixed proxy initialization, removed premature JavaScript injections, and resolved EGL crash flags on incompatible GPUs.
            - **OLED Dark Mode Improvements**: Eliminated mutation observer infinite feedback loops with 200ms debouncing, and scoped force-dark CSS variables to eliminate white text on light pages.

            ---

            ### Installation Requirements
            - Android 8.0+ (API 26) is required.
            - If you are not sure which build to choose, download the **universal** APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
