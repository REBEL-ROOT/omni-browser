name: 🚀 Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment name that holds the signing secrets
        required: false
        default: release
  push:
    tags:
      - 'v*'   # ONLY triggers on version tags like v1.3.0, v2.0.0-beta

jobs:
  release:
    name: Build and Release Signed APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.release_environment || 'release' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # default is 1; a shallow clone can't see previous tags

      - name: Fail if baseVersionCode did not increase
        run: |
          read_code() { grep -oP 'val baseVersionCode\s*=\s*\K\d+' "$1" || echo 0; }
          curr=$(read_code app/build.gradle.kts)
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          [ -z "$prev_tag" ] && exit 0
          git show "$prev_tag:app/build.gradle.kts" > /tmp/prev.kts
          prev=$(read_code /tmp/prev.kts)
          echo "$prev_tag = $prev  ->  ${{ github.ref_name }} = $curr"
          [ "$curr" -gt "$prev" ] || { echo "::error::versionCode regression: $curr <= $prev"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-new.keystore
          echo "✅ Keystore decoded"

      - name: Compile check before release
        run: ./gradlew compileUniversalReleaseKotlin compileArmReleaseKotlin compileAarch64ReleaseKotlin --no-daemon --stacktrace

      - name: Build & Sign Release APK
        run: |
          ./gradlew assembleArmRelease assembleAarch64Release assembleUniversalRelease --no-daemon --stacktrace --info
          if [ -z "$(find app/build/outputs/apk/ -name "*.apk")" ]; then
            echo "❌ APK build failed - no APK generated"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}



      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build output"
            exit 1
          fi
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "✅ APK signature verified" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Rename APKs
        run: |
          export VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then export VERSION="v1.2.6.3"; fi
          find app/build/outputs/apk/ -name "*.apk" -exec bash -c '
            file="$1"
            filename=$(basename "$file")
            if [[ "$filename" == app-arm-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-arm.apk"
            elif [[ "$filename" == app-aarch64-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-aarch64.apk"
            elif [[ "$filename" == app-universal-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-universal.apk"
            fi
          ' bash {} \;
          echo "✅ APKs renamed:"
          ls -lh app/build/outputs/apk/

      - name: Wipe keystore from runner (security cleanup)
        if: always()
        run: |
          rm -f release-new.keystore
          echo "🔒 Keystore wiped from runner"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omni Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          make_latest: "true"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/omni-browser-*.apk
          body: |
            ## Omni Browser ${{ github.ref_name }}

            ⚡ **Optimized R8 Minification Version with Highly Compressed Libraries**
            This build is optimized utilizing aggressive R8 compiler shrinking, optimization, and resource minification alongside highly compressed runtime libraries, delivering maximum performance, enhanced security, and the smallest possible installation footprint.

            ---

            ## 🚀 What's New in ${{ github.ref_name }}

            ### ⚡ Performance, RAM Scaling & Black Screen Fixes
            - **Adaptive Multi-Process & Tab Scaler**: Scaled Gecko content processes (`dom.ipc.processCount`) and live tab caps dynamically based on physical device RAM (up to 8 processes and 24 live tabs on 6GB+ RAM devices, optimized for lower-RAM devices).
            - **Compositor Resource Release on Tab Suspension**: Fixed black screens caused by reaching content process limits by actively deactivating Gecko renderers (`session.setActive(false)`) when background tabs are soft-suspended.
            - **Smart Memory Pressure Handling**: Refined `onTrimMemory` lifecycle hooks to halve live tab caps under memory pressure and restore full capacity once pressure eases.

            ### 🧭 Bottom Address Bar & Keyboard UX
            - **Upward Suggestions & Actions Layout**: When the address bar is configured at the bottom, history suggestions and quick action bars now expand upwards naturally above the keyboard.
            - **IME Keyboard Padding Fix**: Refined keyboard focus insets to eliminate jumping or double-padding when typing into the bottom address bar.
            - **Theme-Adaptive Search Bar**: Enhanced contrast and styling for search bar backgrounds across Light, Dark, and AMOLED modes.

            ### 🧩 WebExtensions Engine & Popup Enhancements
            - **Crash & NPE Prevention**: Added null-safe metadata and extension ID fallbacks (`safeId` / `safeMetaData`) across all extension cards and delegates.
            - **Overhauled Popup Lifecycle**: Configured full prompt, progress, and navigation delegates for extension popups, ensuring seamless handling of alerts, button prompts, and `moz-extension://` navigation.
            - **Smooth Progress Bar**: Replaced heavy blocking spinner overlays with a sleek, non-intrusive top linear progress bar.
            - **Options Page Fallback**: Clicking extensions without active popups now seamlessly opens their options page in a new tab.
            - **Startup & Icon Cache Optimization**: Avoids redundant IPC enable/disable calls and caches extension icons to boost startup performance.

            ### 🎬 Dark Mode & OLED Media Player Protection
            - **Video Player Protection**: Added dynamic video player detection and MutationObservers (`markVideoPlayers`) to prevent force-dark / AMOLED CSS from inverting video controls and overlays.
            - **Refined Contrast**: Grouped core page containers and applied scoped styling to eliminate background washouts.

            ### 🛡️ AdBlock & Scriptlet Fixes
            - **Stealth Defuser JS Injection Fix**: Resolved single-line comment stripping during scriptlet injection, ensuring anti-adblock defuser traps execute cleanly.
            - **Enhanced Crash Logging**: Added thread names and stack traces with visual markers in logcat for faster diagnostic triage.

            ---

            ### Installation Requirements
            - Android 8.0+ (API 26) is required.
            - If you are not sure which build to choose, download the **universal** APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
