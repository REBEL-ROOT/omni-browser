name: 🚀 Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment name that holds the signing secrets
        required: false
        default: release
  push:
    tags:
      - 'v*'   # ONLY triggers on version tags like v1.3.0, v2.0.0-beta

jobs:
  release:
    name: Build and Release Signed APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.release_environment || 'release' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # default is 1; a shallow clone can't see previous tags

      - name: Fail if baseVersionCode did not increase
        run: |
          read_code() { grep -oP 'val baseVersionCode\s*=\s*\K\d+' "$1" || echo 0; }
          curr=$(read_code app/build.gradle.kts)
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          [ -z "$prev_tag" ] && exit 0
          git show "$prev_tag:app/build.gradle.kts" > /tmp/prev.kts
          prev=$(read_code /tmp/prev.kts)
          echo "$prev_tag = $prev  ->  ${{ github.ref_name }} = $curr"
          [ "$curr" -gt "$prev" ] || { echo "::error::versionCode regression: $curr <= $prev"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-new.keystore
          echo "✅ Keystore decoded"

      - name: Compile check before release
        run: ./gradlew compileUniversalReleaseKotlin compileArmReleaseKotlin compileAarch64ReleaseKotlin --no-daemon --stacktrace

      - name: Build & Sign Release APK
        run: |
          ./gradlew assembleArmRelease assembleAarch64Release assembleUniversalRelease --no-daemon --stacktrace --info
          if [ -z "$(find app/build/outputs/apk/ -name "*.apk")" ]; then
            echo "❌ APK build failed - no APK generated"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}



      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build output"
            exit 1
          fi
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "✅ APK signature verified" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Rename APKs
        run: |
          export VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then export VERSION="v1.3.4.1"; fi
          find app/build/outputs/apk/ -name "*.apk" -exec bash -c '
            file="$1"
            filename=$(basename "$file")
            if [[ "$filename" == app-arm-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-arm.apk"
            elif [[ "$filename" == app-aarch64-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-aarch64.apk"
            elif [[ "$filename" == app-universal-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-universal.apk"
            fi
          ' bash {} \;
          echo "✅ APKs renamed:"
          ls -lh app/build/outputs/apk/

      - name: Wipe keystore from runner (security cleanup)
        if: always()
        run: |
          rm -f release-new.keystore
          echo "🔒 Keystore wiped from runner"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omni Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          make_latest: ${{ (contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) && 'false' || 'true' }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/omni-browser-*.apk
          body: |
            ## Omni Browser ${{ github.ref_name }}

            > ⚠️ **Customization Notice & Known Considerations**
            > This release introduces extensive interface personalization through the new **Chrome Drag Layout Editor** (custom bottom navigation bars, address bar action clusters, and draggable home screen sections). Because this involves major UI architecture changes, it **may introduce new bugs or edge cases in the customization area**. If you encounter visual glitches or layout resets, please report them.
            >
            > 🛠️ **Previous Main Bugs Addressed**
            > All previous main known bugs have been touched and reworked in this release in order to thoroughly resolve them (including server redirect handling, privacy fingerprint timezone leaks, bookmark state desyncs, AMOLED theme leaks, OAuth popup session restores, and extension popup action reliability).

            ---

            ## 🚀 What's New in ${{ github.ref_name }} (since v1.3.3.3-beta)

            ### 🎨 Chrome Drag Layout Editor & Customization Overhaul
            - **Interactive Drag-and-Drop Chrome Editor**: Customize browser controls and UI layouts visually via Settings > Appearance.
            - **Custom Navigation Bar Layouts**: Independently customize and reorder action buttons on both the Home Bar and the active Page Bar (Back, Forward, Home, Tabs, Menu, Extensions, Bookmarks, Downloads, Clear Data, Desktop Mode, Reader Mode, and more).
            - **All-in-One Address Bar Clusters**: Customize leading and trailing button clusters flanking the omnibox address bar to suit your workflow.
            - **Reorderable Home Screen Sections**: Drag and reorder sections (Speed Dial, Recent Tabs, Bookmarks, Highlights) directly on the New Tab / Home Screen.
            - **Home Search Bar Positioning**: Added a setting toggle to place the Home Screen search bar at the bottom or top of the display.
            - **Speed Dial Launcher Sheet**: Floating action quick-launcher sheet for fast navigation and instant access to top tools.

            ### 💾 Native Backup & Restore Engine
            - **Full Browser State Backup**: Export your complete Omni configuration into a timestamped, integrity-verified `.omni` package (`BackupEngine.kt`).
            - **Comprehensive Scope**: Backs up and restores bookmarks, history, settings, user agent rules, visual element blocker rules, custom search engines, speed dial layouts, extensions state, and custom chrome button layouts.
            - **Safe Import Preview**: Inspect backup archive contents and manifests before committing restores (`BackupScreen.kt`).

            ### 📁 Hierarchical Bookmark Manager & Netscape Import/Export
            - **Folder-Based Bookmark Manager**: Full tree hierarchy navigation with responsive breadcrumbs, cross-folder search, folder creation, editing, moving, and deletion (`BookmarksScreen.kt`).
            - **Cache Invalidation Fix**: Fixed an issue where the "Clear all" action left the bookmark hierarchy tree in a stale UI state.
            - **Netscape HTML Import & Export**: Import and export browser bookmarks using standard Netscape bookmark HTML format while retaining folder hierarchies.

            ### 🔄 Two-Way Omni Sync (P2P / LAN) & Clean Architecture
            - **Two-Way Sync Outbox**: Local bookmark and tab changes are recorded into an outbound sync queue and proactively transmitted to paired LAN devices, draining cleanly upon confirmation.
            - **Thread-Safe Concurrent Storage**: Introduced `BookmarkStoreLock` across UI threads, sync workers, and LAN WebSocket servers to prevent database lock contention and race conditions.
            - **Secure LAN Password Vault Transfer**: Transfer credentials between paired devices over local Wi-Fi via CSV, protected with a user-visible 6-digit verification code.
            - **Mozilla Sync Stubs Removed**: Completely removed unused and mock Mozilla/Firefox Sync dependencies and stubs in favor of a clean, transparent, lightweight P2P/LAN Omni Sync architecture.

            ### 🛡️ Privacy & Security Refinements
            - **Resist Fingerprinting Timezone Spoofing (Fixes #137)**: `privacy.resistFingerprinting` now strictly honors the Fingerprint Protection toggle (in addition to Tor mode). Timezones are properly spoofed to UTC across both GeckoView runtime and generated config, preventing timezone leaks on sites like `deviceinfo.me` over VPN.

            ### 🧭 Navigation & Server Redirect Fixes
            - **Server Redirect Handling (Fixes #132)**: Server-side HTTP redirects (301, 302, 303, 307, 308) in `NavigationDelegate.onLoadRequest` now immediately return `ALLOW` and bypass subnavigation block rules, preventing redirect loops and stranded "Page has moved" screens. Non-renderable redirect targets cleanly proceed to download handlers via `onExternalResponse`.

            ### 🧩 WebExtension Platform Stability
            - **Extension Action Popups & Permissions**: Overhauled extension action menu patching, popup lifecycle management, and dynamic host/clipboard permission prompts (`browser.permissions.request()`) for password managers and curated extensions.

            ---

            ### 📦 Installation Requirements
            - Android 8.0+ (API 26) is required.
            - If you are not sure which build to choose, download the **universal** APK (`omni-browser-v1.3.4.1-universal.apk`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
