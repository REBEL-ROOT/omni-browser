name: 🚀 Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment name that holds the signing secrets
        required: false
        default: release
  push:
    tags:
      - 'v*'   # ONLY triggers on version tags like v1.3.0, v2.0.0-beta

jobs:
  release:
    name: Build and Release Signed APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.release_environment || 'release' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # default is 1; a shallow clone can't see previous tags

      - name: Fail if baseVersionCode did not increase
        run: |
          read_code() { grep -oP 'val baseVersionCode\s*=\s*\K\d+' "$1" || echo 0; }
          curr=$(read_code app/build.gradle.kts)
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          [ -z "$prev_tag" ] && exit 0
          git show "$prev_tag:app/build.gradle.kts" > /tmp/prev.kts
          prev=$(read_code /tmp/prev.kts)
          echo "$prev_tag = $prev  ->  ${{ github.ref_name }} = $curr"
          [ "$curr" -gt "$prev" ] || { echo "::error::versionCode regression: $curr <= $prev"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-new.keystore
          echo "✅ Keystore decoded"

      - name: Compile check before release
        run: ./gradlew compileUniversalReleaseKotlin compileArmReleaseKotlin compileAarch64ReleaseKotlin --no-daemon --stacktrace

      - name: Build & Sign Release APK
        run: |
          ./gradlew assembleArmRelease assembleAarch64Release assembleUniversalRelease --no-daemon --stacktrace --info
          if [ -z "$(find app/build/outputs/apk/ -name "*.apk")" ]; then
            echo "❌ APK build failed - no APK generated"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}



      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build output"
            exit 1
          fi
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "✅ APK signature verified" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Rename APKs
        run: |
          export VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then export VERSION="v1.3.5.1"; fi
          find app/build/outputs/apk/ -name "*.apk" -exec bash -c '
            file="$1"
            filename=$(basename "$file")
            if [[ "$filename" == app-arm-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-arm.apk"
            elif [[ "$filename" == app-aarch64-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-aarch64.apk"
            elif [[ "$filename" == app-universal-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-universal.apk"
            fi
          ' bash {} \;
          echo "✅ APKs renamed:"
          ls -lh app/build/outputs/apk/

      - name: Wipe keystore from runner (security cleanup)
        if: always()
        run: |
          rm -f release-new.keystore
          echo "🔒 Keystore wiped from runner"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omni Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          make_latest: ${{ (contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) && 'false' || 'true' }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/omni-browser-*.apk
          body: |
            ## Omni Browser ${{ github.ref_name }}

            > 🚀 **Highlights in this release**
            > - **Manga & Manwha Reader Fixes**: Strict referrer policies and ContentBlocking anti-tracking fixes to restore image loading on sites like MangaFire.
            > - **Universal Document Downloads**: Full support for downloading and streaming documents, PDFs, spreadsheets, presentations, and eBooks, with authenticated Necko handling for Google Drive and cloud storage.
            > - **Native PDF Printing**: Native Android print adapter integration (`saveAsPdf` and system PrintManager) with preview lifecycle stability and wake-lock management.
            > - **Web Apps & PWAs Hub**: Complete Web Apps catalog, repository, sharing intents, and floating text action support (#133).
            > - **Home Screen Extension Pinning**: Pin your favorite extensions directly to your device launcher home screen.

            ---

            ## 🛠️ What's New in ${{ github.ref_name }} (since v1.3.4.1)

            ### 🖼️ Manga & Manwha Image Loading
            - **Strict Referrer & Origin Policies**: Configured `network.http.referer.defaultPolicy = 2` (`strict-origin-when-cross-origin`), `trimmingPolicy = 0`, `XOriginPolicy = 0`, `XOriginTrimmingPolicy = 2`, and `sendRefererHeader = 2`.
            - **Anti-Tracking CDN Bypass**: Adjusted GeckoView ContentBlocking anti-tracking policy to allow anti-hotlink image CDNs on MangaFire and similar sites to receive valid referrer origins without being blocked.

            ### 📥 Universal Document & Stream Download Engine
            - **Exhaustive Document MIME & Extension Mappings**: Support for `pdf`, `doc`, `docx`, `odt`, `rtf`, `pages`, `xls`, `xlsx`, `ods`, `csv`, `tsv`, `numbers`, `ppt`, `pptx`, `odp`, `key`, `epub`, `mobi`, `azw`, `azw3`, `cbr`, `cbz`, `apk`, `xapk`, `apks`, archives, and media.
            - **Direct Stream Downloads**: New streaming download handler (`startGenericFileDownloadFromStream`) with modern browser headers (`User-Agent`, `Accept`, `Sec-Fetch-*`) and cookie preservation across redirects.
            - **Necko Engine Passthrough**: Authenticated downloads (Google Drive, cloud storage) are initiated directly through GeckoView's Necko stack with full session cookies; dangling popup tabs are cleanly closed.
            - **Download Modal Updates**: Modern file type icon mappings and clean dismiss/cancellation handling.

            ### 🖨️ Native PDF Print Support
            - **PdfPrintDocumentAdapter**: Custom print document adapter preventing print preview cancellation freezes and managing wake-locks.
            - **GeckoView Print Delegate**: Connected `tab.session.printDelegate` with native Android `PrintManager` and added `android.permission.WAKE_LOCK`.

            ### 📱 Web Apps & PWAs Hub (#133)
            - **Web Apps & PWAs Hub**: Dedicated catalog, database, repository, and management screen for progressive web apps.
            - **System Share Menu Integration**: Added Omni Browser to Android system link sharing menu (`ACTION_SEND` with `text/plain`).
            - **Floating Selection Menu**: Support for `ACTION_PROCESS_TEXT` and enhanced link parsing via `IntentUrlParser`.

            ### 🧩 UI & Extension Polish
            - **Launcher Shortcut Pinning**: Pin WebExtensions directly to the device launcher home screen (`EXTRA_EXTENSION_SHORTCUT`).
            - **Nav Bar Icon Sizing**: Unified navigation action icons to dynamic `navIconSize`.
            - **API 28 Compatibility**: Fixed dropdown menu white splash and layout failure on Android 9 by using API-safe Popup.
            - **Localization**: Added missing navigation and tool strings across all 13 supported languages.

            ---

            ### 📦 Installation Requirements
            - Android 8.0+ (API 26) is required.
            - If you are not sure which build to choose, download the **universal** APK (`omni-browser-${{ github.ref_name }}-universal.apk`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
