name: 🚀 Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub Environment name that holds the signing secrets
        required: false
        default: release
  push:
    tags:
      - 'v*'   # ONLY triggers on version tags like v1.3.0, v2.0.0-beta

jobs:
  release:
    name: Build and Release Signed APK
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.release_environment || 'release' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # default is 1; a shallow clone can't see previous tags

      - name: Fail if baseVersionCode did not increase
        run: |
          read_code() { grep -oP 'val baseVersionCode\s*=\s*\K\d+' "$1" || echo 0; }
          curr=$(read_code app/build.gradle.kts)
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          [ -z "$prev_tag" ] && exit 0
          git show "$prev_tag:app/build.gradle.kts" > /tmp/prev.kts
          prev=$(read_code /tmp/prev.kts)
          echo "$prev_tag = $prev  ->  ${{ github.ref_name }} = $curr"
          [ "$curr" -gt "$prev" ] || { echo "::error::versionCode regression: $curr <= $prev"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-new.keystore
          echo "✅ Keystore decoded"

      - name: Compile check before release
        run: ./gradlew compileUniversalReleaseKotlin compileArmReleaseKotlin compileAarch64ReleaseKotlin --no-daemon --stacktrace

      - name: Build & Sign Release APK
        run: |
          ./gradlew assembleArmRelease assembleAarch64Release assembleUniversalRelease --no-daemon --stacktrace --info
          if [ -z "$(find app/build/outputs/apk/ -name "*.apk")" ]; then
            echo "❌ APK build failed - no APK generated"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}



      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build output"
            exit 1
          fi
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "✅ APK signature verified" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Rename APKs
        run: |
          export VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then export VERSION="v1.3.3.3-beta"; fi
          find app/build/outputs/apk/ -name "*.apk" -exec bash -c '
            file="$1"
            filename=$(basename "$file")
            if [[ "$filename" == app-arm-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-arm.apk"
            elif [[ "$filename" == app-aarch64-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-aarch64.apk"
            elif [[ "$filename" == app-universal-release.apk ]]; then
              mv "$file" "app/build/outputs/apk/omni-browser-${VERSION}-universal.apk"
            fi
          ' bash {} \;
          echo "✅ APKs renamed:"
          ls -lh app/build/outputs/apk/

      - name: Wipe keystore from runner (security cleanup)
        if: always()
        run: |
          rm -f release-new.keystore
          echo "🔒 Keystore wiped from runner"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omni Browser ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          make_latest: ${{ (contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) && 'false' || 'true' }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/omni-browser-*.apk
          body: |
            ## Omni Browser ${{ github.ref_name }} (Pre-release)

            ⚡ **Optimized R8 Minification Version with Highly Compressed Libraries**
            This build is optimized utilizing aggressive R8 compiler shrinking, optimization, and resource minification alongside highly compressed runtime libraries, delivering maximum performance, enhanced security, and the smallest possible installation footprint.

            ---

            ## 🚀 What's New in ${{ github.ref_name }}

            ### 🧭 Navigation & Session History
            - **Long-Press Session History Menu**: Long-pressing the Back or Forward navigation buttons now opens an interactive session history bottom sheet to jump directly to any previous or forward page in the tab's navigation stack (including the New Tab / Home Screen root).
            - **Improved Back/Forward Navigation Stack**: Refined tab navigation stack tracking and state restoration across web pages and home screen transitions.

            ### 🎛️ Address Bar & Scroll Controls
            - **Side Scroll Bar Toggle Fix**: Properly disables the vertical fast-scroll side bar when the *Side Scroll Bar* toggle is turned off in Site Settings, and updated setting labels/descriptions for clarity.
            - **Top Address Bar & Tablet Menu Enhancements**: Restored the 3-dot dropdown menu (`MoreVert`) in Top Address Bar and Adaptive Tablet Chrome modes with full quick-action wiring (New Tab, Incognito, Burn Data, Find in Page, Extensions, and Settings), and kept the menu accessible while the address bar input is focused.

            ### 🛡️ Privacy & Content Blocking Refinements
            - **Total Cookie Protection (dFPI) & Cookie Behavior**: Corrected GeckoView cookie behavior mappings and added *Isolate third-party cookies (Total Cookie Protection)* alongside tracker-blocking and strict cookie controls.
            - **Stricter Social Tracker Filtering**: Removed social media root domains from the filter-list immunity set so third-party social tracking subdomains (e.g., `connect.facebook.net`, `platform.twitter.com`) are never exempted from filter rules.

            ### ⚙️ Recent 1.3.3.x Improvements Included
            - **`omni:config` Engine Flags & Small-Screen Layout**: Added curated Gecko engine flags and fixed responsive layout and status bar padding on compact devices.
            - **AMOLED Theme & Speed Dial**: Fixed AMOLED theme leak (#118), updated Speed Dial to a 5-column layout, and added *"Open in [App]"* to the Omni menu sheet.

            ---

            ### Installation Requirements
            - Android 8.0+ (API 26) is required.
            - If you are not sure which build to choose, download the **universal** APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
