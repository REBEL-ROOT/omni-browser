Name: Omni Browser
Summary: Omni Browser — Private, Fast & Powerful
Description: |-
  Omni Browser is a privacy-first, feature-rich Android web browser built on Mozilla's GeckoView engine.

  Privacy & Security:
  * Built-in uBlock-style content blocker
  * Popup & ad-tab blocker
  * Smart Force Dark Theme built-in WebExtension engine
  * Built-in WebExtensions (Universal Copy, AI Blocker, Force Dark)
  * Chrome/Brave-style Downloads section with storage metrics and file management
  * Vault — encrypted SQLCipher local storage for private downloads
  * 100% Free and Open Source (No tracking, no telemetry, no Google Play Services)

